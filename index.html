<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiyat Hesaplayıcı</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;padding:15px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
h2{margin-top:0}
label{display:block;margin:10px 0 5px;font-weight:bold}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;background:#1976d2;color:#fff;border:0;border-radius:6px;font-weight:bold;margin-top:10px;cursor:pointer}
.result{font-size:18px;line-height:1.8}
.logo{max-height:60px}
@media print{button{display:none}}
</style>
</head>
<body>

<div class="card">
<h2>⚙️ Ayarlar</h2>
<label>Firma Ünvanı</label><input id="firmaUnvan" value="Yücel">
<label>Adres</label><input id="adres">
<label>Telefon</label><input id="telefon">
<label>Mail</label><input id="mail">
<label>Web Adresi</label><input id="web">
<label>Banka Hesap Bilgileri (IBAN)</label><input id="banka">
<label>Logo Yükle</label><input type="file" id="logoInput" accept="image/*">
<img id="logoPreview" class="logo" style="display:none;margin-top:10px">
<label>Döviz Kuru (1 USD = TL)</label><input type="number" id="doviz" value="47" step="0.01">
<button onclick="saveSettings()">Kaydet</button>
</div>

<div class="card">
<h2>🧮 Fiyat Hesaplayıcı</h2>

<label>1. Ürün Seç</label>
<select id="urunSelect"></select>

<label>2. Marka Seç</label>
<select id="markaSelect">
<option value="YÜCEL">YÜCEL</option>
<option value="TOSÇELİK">TOSÇELİK</option>
</select>

<label>3. Para Birimi</label>
<select id="paraSelect">
<option value="TL" selected>TL (Yücel öncelikli)</option>
<option value="USD">$</option>
</select>

<label>4. Hesap Tipi</label>
<select id="tipSelect">
<option value="adet">Adet (1 Adet = 6 Metre)</option>
<option value="metre">Metre</option>
</select>

<label>Miktar</label>
<input type="number" id="miktar" value="1" min="1">

<label>İskonto Oranı (%)</label>
<input type="number" id="iskonto" value="0" min="0" max="100">

<label>KDV Oranı (%)</label>
<input type="number" id="kdv" value="20" min="0">

<button onclick="hesapla()">Hesapla</button>
<button onclick="window.print()" style="background:#4caf50">Yazdır / PDF Al</button>

<div class="result" id="sonuc" style="margin-top:20px"></div>
</div>

<script>
let fiyatlar = [];
const urunSelect = document.getElementById('urunSelect');

// fiyat.json dosyasını oku
fetch('fiyat.json')
.then(res => res.json())
.then(data => {
  fiyatlar = data;
  urunSelect.innerHTML = '';
  fiyatlar.forEach((p,i)=>{
    let o=document.createElement('option');
    o.value=i;
    o.textContent=p.urun;
    urunSelect.appendChild(o);
  });
})
.catch(err=>{
  urunSelect.innerHTML = '<option>Fiyat.json bulunamadı. Dosyayı index.html ile aynı klasöre koy.</option>';
  console.error(err);
});

function saveSettings(){
 localStorage.setItem('ayarlar', JSON.stringify({
  unvan:document.getElementById('firmaUnvan').value,
  adres:document.getElementById('adres').value,
  tel:document.getElementById('telefon').value,
  mail:document.getElementById('mail').value,
  web:document.getElementById('web').value,
  banka:document.getElementById('banka').value,
  doviz:document.getElementById('doviz').value
 }));
 alert('Kaydedildi');
}

function hesapla(){
 if(!fiyatlar.length){ alert('Fiyatlar yüklenmedi'); return; }
 const idx = urunSelect.value;
 const urun = fiyatlar[idx];
 const marka = document.getElementById('markaSelect').value;
 const para = document.getElementById('paraSelect').value;
 const tip = document.getElementById('tipSelect').value;
 const miktar = parseFloat(document.getElementById('miktar').value)||1;
 const iskonto = parseFloat(document.getElementById('iskonto').value)||0;
 const kdv = parseFloat(document.getElementById('kdv').value)||0;
 const doviz = parseFloat(document.getElementById('doviz').value)||47;

 let birimFiyat = para==='TL' ? urun.fiyatTL : urun.fiyatUSD;
 let toplamMetre = tip==='adet' ? miktar*6 : miktar;
 let hamTutar = birimFiyat * toplamMetre;
 let iskontolu = hamTutar * (1 - iskonto/100);
 let kdvTutari = iskontolu * (kdv/100);
 let genelToplam = iskontolu + kdvTutari;

 let ayar = JSON.parse(localStorage.getItem('ayarlar')||'{}');

 document.getElementById('sonuc').innerHTML = `
 <hr>
 <img src="${document.getElementById('logoPreview').src||''}" class="logo" style="display:${document.getElementById('logoPreview').style.display}">
 <b>${ayar.unvan||''}</b><br>
 ${ayar.adres||''}<br>
 Tel: ${ayar.tel||''} | Mail: ${ayar.mail||''}<br>
 Web: ${ayar.web||''}<br>
 Banka: ${ayar.banka||''}<br>
 <hr>
 <b>Ürün:</b> ${urun.urun}<br>
 <b>Marka:</b> ${marka}<br>
 <b>Birim Fiyat (${para}):</b> ${birimFiyat.toFixed(2)}<br>
 <b>Miktar:</b> ${miktar} ${tip==='adet'?'Adet':'Metre'} (${toplamMetre} Metre)<br>
 <b>Ara Toplam:</b> ${hamTutar.toFixed(2)} ${para}<br>
 <b>İskonto (%${iskonto}):</b> ${(hamTutar-iskontolu).toFixed(2)} ${para}<br>
 <b>İskontolu Fiyat:</b> ${iskontolu.toFixed(2)} ${para}<br>
 <b>KDV (%${kdv}):</b> ${kdvTutari.toFixed(2)} ${para}<br>
 <b>GENEL TOPLAM:</b> ${genelToplam.toFixed(2)} ${para}<br>
 <small>Kur: 1 USD = ${doviz} TL</small>
 `;
}

document.getElementById('logoInput').addEventListener('change', e=>{
 const file = e.target.files[0];
 if(file){ const r=new FileReader(); r.onload=ev=>{ document.getElementById('logoPreview').src=ev.target.result; document.getElementById('logoPreview').style.display='block'; }; r.readAsDataURL(file); }
});
</script>
</body>
</html>
