<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiyat Teklif</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;padding:12px}
.card{background:#fff;padding:12px;border-radius:8px;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{display:block;margin:6px 0 3px;font-weight:bold;font-size:12px}
input,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}
button{padding:9px 12px;background:#1976d2;color:#fff;border:0;border-radius:5px;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:11px;display:block;overflow-x:auto}
th{background:#b3d9ff;padding:5px;border:1px solid #999;white-space:nowrap}
td{padding:4px;border:1px solid #ccc;white-space:nowrap}
#ayarIkon{position:fixed;top:12px;right:12px;background:#333;color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:999}
#ayarModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center}
.modalBox{background:#fff;padding:15px;width:92%;max-width:560px;border-radius:10px;max-height:92vh;overflow-y:auto}
.logo{max-height:45px}
</style>
</head>
<body>

<div id="ayarIkon" onclick="document.getElementById('ayarModal').style.display='flex'">⚙️</div>

<div id="ayarModal">
<div class="modalBox">
<h3 style="margin-top:0">Ayarlar</h3>
<div class="grid">
<div><label>Firma Ünvanı</label><input id="firmaUnvan" value="YÜCEL"></div>
<div><label>Döviz Kuru (TCMB)</label><input id="doviz" value="47" step="0.01"></div>
</div>
<label>Adres</label><input id="adres">
<div class="grid">
<div><label>Telefon</label><input id="telefon"></div>
<div><label>Mail</label><input id="mail"></div>
</div>
<div class="grid">
<div><label>Web</label><input id="web"></div>
<div><label>Banka Hesap</label><input id="banka"></div>
</div>
<label>Logo</label><input type="file" id="logoInput" accept="image/*">
<img id="logoPreview" class="logo" style="display:none;margin-top:8px">
<button onclick="saveSettings()" style="width:100%;margin-top:12px">Kaydet</button>
<button onclick="document.getElementById('ayarModal').style.display='none'" style="width:100%;background:#888;margin-top:5px">Kapat</button>
</div>
</div>

<div class="card">
<img id="logoTop" class="logo" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
<h2 id="firmaBaslik" style="margin:0">FİYAT TEKLİFİ</h2>
<div style="font-size:12px">TCMB USD: <b id="tcmbKur">Yükleniyor...</b> TL</div>
</div>
<p id="firmaBilgi" style="margin:6px 0;font-size:13px"></p>
<hr style="margin:6px 0">
<div class="grid">
<div><label>Müşteri Ünvanı</label><input id="musteriUnvan" placeholder="Müşteri adı"></div>
<div><label>İletişim Bilgileri</label><input id="musteriTel" placeholder="Telefon, Mail, Adres"></div>
</div>
</div>

<div class="card">
<h3 style="margin:0 0 6px">Ürün Ekle</h3>
<div class="grid">
<div><label>Ürün Seç</label><select id="urunSelect"><option>Yükleniyor...</option></select></div>
<div><label>Marka</label><select id="markaSelect"><option value="YÜCEL">YÜCEL</option><option value="TOSÇELİK">TOSÇELİK</option></select></div>
</div>
<div class="grid3">
<div><label>Para Birimi</label><select id="paraSelect"><option value="TL" selected>TL</option><option value="USD">$</option></select></div>
<div><label>Evrak Birim</label><select id="tipSelect"><option value="adet">Adet</option><option value="metre">Metre</option></select></div>
<div><label>Miktar</label><input type="number" id="miktar" value="1"></div>
</div>
<div class="grid">
<div><label>İskonto (%)</label><input type="number" id="iskonto" value="0"></div>
<div><label>KDV (%)</label><input type="number" id="kdv" value="20"></div>
</div>
<button onclick="tabloyaEkle()" style="width:100%;margin-top:8px">+ Tabloya Ekle</button>
</div>

<div class="card">
<h3 style="margin:0 0 6px">Teklif Listesi</h3>
<table>
<thead><tr>
<th>Mal Adı</th><th>Evrak Miktar</th><th>Evrak Birim</th><th>Miktar</th><th>Birim</th><th>Fiyat Şablonu</th><th>Liste Açıklaması</th><th>Kalem İskonto Oranı</th><th>Net Birim Fiyat</th><th>KDV Kesinti Oranı</th><th>Evrak Tutar</th><th>Evrak İskonto</th><th>Evrak KDV</th><th>Evrak Toplam</th><th>Sil</th>
</tr></thead>
<tbody id="tabloBody"></tbody>
</table>
<div style="margin-top:10px;font-weight:bold">Evrak Toplam: <span id="genelToplam">0,00</span> <span id="paraBirimiGoster">TL</span></div>
<button onclick="window.print()" style="background:#4caf50;margin-top:8px">Yazdır / PDF Al</button>
</div>

<script>
let fiyatlar=[];

// TCMB Kuru Çek
async function tcmbKurAl(){
  try{
    const res = await fetch('https://www3.tcmb.gov.tr/yeni/bulten.xml');
    const text = await res.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");
    const usd = xml.querySelector('Currency[Code="USD"]');
    if(usd){
      const kur = parseFloat(usd.querySelector('BanknoteBuying').textContent.replace(',','.'));
      document.getElementById('doviz').value = kur.toFixed(2);
      document.getElementById('tcmbKur').textContent = kur.toFixed(2);
    }
  }catch(e){
    // TCMB CORS engellerse yedek
    try{
      const r2 = await fetch('https://api.exchangerate.host/convert?from=USD&to=TRY');
      const j2 = await r2.json();
      if(j2.result){ document.getElementById('doviz').value = j2.result; document.getElementById('tcmbKur').textContent = j2.result; }
    }catch(e2){
      document.getElementById('tcmbKur').textContent = 'Manuel';
    }
  }
}
tcmbKurAl();

fetch('https://raw.githubusercontent.com/ahmetdogan68/hesap/refs/heads/main/fiyat.json')
.then(r=>r.json())
.then(data=>{
  fiyatlar=data;
  let sel=document.getElementById('urunSelect');
  sel.innerHTML='';
  data.forEach((p,i)=>{
    let o=document.createElement('option');
    o.value=i;
    o.textContent=p.urun;
    sel.appendChild(o);
  });
})
.catch(e=>{
  document.getElementById('urunSelect').innerHTML='<option>Fiyat.json yüklenemedi</option>';
  console.error(e);
});

function saveSettings(){
 let a={unvan:document.getElementById('firmaUnvan').value,adres:document.getElementById('adres').value,tel:document.getElementById('telefon').value,mail:document.getElementById('mail').value,web:document.getElementById('web').value,banka:document.getElementById('banka').value,doviz:document.getElementById('doviz').value};
 localStorage.setItem('ayarlar',JSON.stringify(a));
 firmaGoster(); alert('Kaydedildi'); document.getElementById('ayarModal').style.display='none';
}
function firmaGoster(){
 let a=JSON.parse(localStorage.getItem('ayarlar')||'{}');
 document.getElementById('firmaBaslik').textContent=a.unvan||'FİYAT TEKLİFİ';
 document.getElementById('firmaBilgi').innerHTML=`${a.adres||''}<br>Tel: ${a.tel||''} | ${a.mail||''} | ${a.web||''}<br>Banka: ${a.banka||''}`;
}
firmaGoster();

document.getElementById('logoInput').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=ev=>{
  document.getElementById('logoPreview').src=ev.target.result;
  document.getElementById('logoPreview').style.display='block';
  document.getElementById('logoTop').src=ev.target.result;
  document.getElementById('logoTop').style.display='block';
 }; r.readAsDataURL(f);
});

function tabloyaEkle(){
 if(!fiyatlar.length) return alert('Fiyatlar yüklenmedi');
 let idx=document.getElementById('urunSelect').value;
 let urun=fiyatlar[idx];
 let marka=document.getElementById('markaSelect').value;
 let para=document.getElementById('paraSelect').value;
 let tip=document.getElementById('tipSelect').value;
 let miktar=parseFloat(document.getElementById('miktar').value)||1;
 let isk=parseFloat(document.getElementById('iskonto').value)||0;
 let kdv=parseFloat(document.getElementById('kdv').value)||20;
 let birimFiyat=para==='TL'?urun.fiyatTL:urun.fiyatUSD;
 let toplamMetre=tip==='adet'?miktar*6:miktar;
 let tutar=birimFiyat*toplamMetre;
 let iskontolu=tutar*(1-isk/100);
 let kdvT=iskontolu*(kdv/100);
 let toplam=iskontolu+kdvT;

 let tr=document.createElement('tr');
 tr.innerHTML=`<td>${urun.urun} ${marka}</td><td>${miktar}</td><td>${tip==='adet'?'Adet':'Metre'}</td><td>${toplamMetre}</td><td>Metre</td><td>${marka} 2025</td><td>KUL</td><td>${isk.toFixed(2)}</td><td>${birimFiyat.toFixed(2)} ${para}</td><td>${kdv.toFixed(2)}</td><td>${tutar.toFixed(2)}</td><td>${(tutar-iskontolu).toFixed(2)}</td><td>${kdvT.toFixed(2)}</td><td data-toplam="${toplam}">${toplam.toFixed(2)}</td><td><button onclick="this.parentElement.parentElement.remove();toplamHesapla()" style="background:#f44336;padding:4px 8px">X</button></td>`;
 document.getElementById('tabloBody').appendChild(tr);
 document.getElementById('paraBirimiGoster').textContent=para;
 toplamHesapla();
}
function toplamHesapla(){
 let sum=0;
 document.querySelectorAll('[data-toplam]').forEach(el=> sum+=parseFloat(el.dataset.toplam));
 document.getElementById('genelToplam').textContent=sum.toFixed(2).replace('.',',');
}
</script>
</body>
</html>
