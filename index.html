<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Fiyat Teklif</title>
<style>
body{font-family:Arial;padding:15px;background:#f5f5f5}
.card{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px}
label{display:block;margin:8px 0 4px;font-weight:bold}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}
button{width:100%;padding:12px;background:#1976d2;color:#fff;border:0;border-radius:5px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>Fiyat Teklif</h2>
<label>Müşteri Ünvanı</label><input id="musteriUnvan" placeholder="Buraya yaz">
<label>İletişim Bilgileri</label><input id="musteriTel" placeholder="Telefon, Mail">
</div>

<div class="card">
<label>Ürün Seç</label>
<select id="urunSelect"><option>Yükleniyor...</option></select>

<label>Marka</label>
<select id="markaSelect"><option>YÜCEL</option><option>TOSÇELİK</option></select>

<label>Para Birimi</label>
<select id="paraSelect"><option>TL</option><option>USD</option></select>

<label>Evrak Birim</label>
<select id="tipSelect"><option>Adet</option><option>Metre</option></select>

<label>Miktar</label><input type="number" id="miktar" value="1">
<label>İskonto (%)</label><input type="number" id="iskonto" value="0">
<label>KDV (%)</label><input type="number" id="kdv" value="20">

<button onclick="hesapla()">Hesapla</button>
<div id="sonuc" style="margin-top:15px;font-weight:bold"></div>
</div>

<script>
fetch('https://ahmetdogan68.github.io/hesap/fiyat.json')
.then(r=>r.json())
.then(data=>{
  let sel=document.getElementById('urunSelect');
  sel.innerHTML='';
  data.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=p.urun;sel.appendChild(o);});
})
.catch(()=>{document.getElementById('urunSelect').innerHTML='<option>fiyat.json bulunamadı</option>'});

function hesapla(){
  let idx=document.getElementById('urunSelect').value;
  // fiyatları tekrar çekmek yerine basit hesap
  document.getElementById('sonuc').textContent='Ürün seçildi: '+document.getElementById('urunSelect').options[document.getElementById('urunSelect').selectedIndex].text;
}
</script>
</body>
</html>
