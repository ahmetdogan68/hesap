<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Çelik Fiyat Teklif</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-5xl mx-auto bg-white rounded-xl shadow p-4">
<h1 class="text-2xl font-bold mb-2">HR Çelik Fiyat Teklif</h1>
<input id="search" onkeyup="search()" placeholder="Ebat ara: 15x15..." class="w-full border p-2 rounded mb-3">
<select id="type" onchange="search()" class="w-full border p-2 rounded mb-3">
<option value="">Tümü</option>
<option value="Konstruksiyon Profili">Konstruksiyon Profili</option>
<option value="Konstruksiyon Boru">Konstruksiyon Boru</option>
<option value="Sanayi Profili">Sanayi Profili</option>
<option value="Sanayi Boru">Sanayi Boru</option>
</select>
<table class="w-full text-sm">
<thead><tr class="bg-gray-200"><th class="p-2 text-left">Ebat</th><th class="p-2">Et Kal.</th><th class="p-2">Fiyat TL/mt</th><th class="p-2">Fiyat USD/mt</th><th></th></tr></thead>
<tbody id="list"></tbody>
</table>
<div class="mt-6 border-t pt-4">
<h2 class="font-bold">Teklif Sepeti</h2>
<div id="cart"></div>
<div id="total" class="font-bold mt-2"></div>
<button onclick="whatsapp()" class="bg-green-600 text-white px-4 py-2 rounded mt-2 w-full">WhatsApp'tan Teklif Gönder</button>
<button onclick="window.print()" class="bg-blue-600 text-white px-4 py-2 rounded mt-2 w-full">Yazdır / PDF Al</button>
</div>
</div>
<script>
let data=[];
let cart=[];
fetch('data.json').then(r=>r.json()).then(j=>{data=j; render(data);});
function render(arr){
 document.getElementById('list').innerHTML = arr.map((r,i)=>`<tr class="border-b"><td class="p-2 font-bold">${r.ebat}</td><td class="p-2 text-center">${r.et}</td><td class="p-2 text-center">${r.tl} ₺</td><td class="p-2 text-center">${r.usd} $</td><td><button onclick="add(${i})" class="bg-orange-500 text-white px-2 py-1 rounded text-xs">+ Ekle</button></td></tr>`).join('');
}
function search(){
 let q=document.getElementById('search').value.toLowerCase();
 let t=document.getElementById('type').value;
 let f=data.filter(r=>r.ebat.toLowerCase().includes(q) && (!t || r.tur==t));
 render(f);
}
function add(i){
 cart.push(data[i]);
 updateCart();
}
function updateCart(){
 let total=0;
 document.getElementById('cart').innerHTML = cart.map((r,i)=>{
  let p=parseFloat(r.tl.replace(',','.'));
  total+=p;
  return `<div class="flex justify-between text-sm py-1"><span>${r.ebat} - ${r.et}mm</span><span>${r.tl} ₺</span><button onclick="cart.splice(${i},1);updateCart()" class="text-red-500">Sil</button></div>`
 }).join('');
 document.getElementById('total').innerText = "Toplam (1mt): " + total.toFixed(2) + " ₺";
}
function whatsapp(){
 let txt="Fiyat Teklifi:%0A"+cart.map(r=>r.ebat+" - "+r.et+"mm - "+r.tl+" TL/mt").join("%0A");
 window.open("https://wa.me/?text="+txt);
}
</script>
</body>
</html>
