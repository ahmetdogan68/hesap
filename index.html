<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UYAP e-SATIŞ PROFİL</title>
<style>
body{font-family:Arial,sans-serif; margin:15px; background:#f9f9f9;}
.card{background:#fff; padding:12px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.1); margin-bottom:15px;}
label{font-size:11px; font-weight:bold; display:block; margin-bottom:2px; white-space:nowrap;}
input,select{padding:6px; border:1px solid #ccc; border-radius:4px; width:100%; box-sizing:border-box; font-size:13px;}
button{padding:8px 14px; background:#1976d2; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px;}
table{width:100%; border-collapse:collapse; margin-top:12px;}
th,td{border:1px solid #ddd; padding:6px; font-size:12px; text-align:left;}
th{background:#f0f0f0;}
#urunList{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #ddd; max-height:250px; overflow-y:auto; display:none; z-index:1000; box-shadow:0 4px 8px rgba(0,0,0,.15);}
#urunList div{padding:7px; cursor:pointer;}
#urunList div:hover{background:#e3f2fd;}
.flex-row{display:flex; gap:6px; align-items:flex-end; flex-wrap:nowrap; overflow-x:auto; padding-bottom:5px;}
.flex-row > div{flex:1; min-width:70px;}
.para-small{flex:0 0 65px !important; min-width:65px !important;}
.urun-big{flex:2.2 !important; min-width:200px !important;}
</style>
</head>
<body>
<h3>Ürün Ekle</h3>
<div class="card">
  <div class="flex-row">
    <div class="urun-big" style="position:relative;">
      <label>Ürün Seç</label>
      <input type="text" id="urunSearch" placeholder="40x60 yazın..." autocomplete="off">
      <div id="urunList"></div>
    </div>
    <div><label>Marka</label><select id="marka"><option>YÜCEL</option></select></div>
    <div class="para-small"><label>Para Birimi</label><select id="paraBirimi"><option>TL</option><option>USD</option></select></div>
    <div><label>Miktar</label><input type="number" id="miktar" value="10"></div>
    <div><label>Evrak</label><select id="evrak"><option>Adet</option></select></div>
    <div><label>Evrak Birim</label><select id="evrakBirim"><option>Metre</option><option>Adet</option><option>Kg</option></select></div>
    <div><label>Miktar Birim</label><input type="number" id="miktarBirim" value="60"></div>
    <div><label>O Fiyat</label><input type="text" id="oFiyat" readonly style="background:#f5f5f5;"></div>
    <div><label>İskonto (%)</label><input type="number" id="iskonto" value="0"></div>
    <div><label>İskontolu Fiyat</label><input type="text" id="iskontoluFiyat" readonly style="background:#e3f2fd;"></div>
    <div><label>KDV (%)</label><input type="number" id="kdvOran" value="20"></div>
    <div><label>KDV Tutar</label><input type="text" id="kdvTutar" readonly style="background:#f5f5f5;"></div>
    <div><label>Genel Toplam</label><input type="text" id="genelToplam" readonly style="background:#e3f2fd; font-weight:bold;"></div>
    <div style="flex:0 0 auto;"><button onclick="addToCart()">+ Ekle</button></div>
  </div>
</div>

<div class="card">
  <h3>Sepet</h3>
  <table id="cartTable">
    <thead><tr><th>Ürün</th><th>Miktar</th><th>Metre</th><th>İskonto</th><th>KDV</th><th>Tutar</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <div style="text-align:right; margin-top:12px; font-size:14px;">
    <div>Ara Toplam: <b id="araToplam">0 TL</b></div>
    <div>KDV: <b id="toplamKdv">0 TL</b></div>
    <div style="font-size:16px;">GENEL TOPLAM: <b id="genelToplamSepet">0 TL</b></div>
  </div>
  <button onclick="window.print()" style="margin-top:8px;">Yazdır</button>
</div>

<script>
let urunler = [];
let selectedUrun = null;
let sepet = [];

// fiyat.json'dan çek
fetch('fiyat.json')
.then(r=>{
  if(!r.ok) throw new Error('fiyat.json bulunamadı');
  return r.json();
})
.then(data=>{
  urunler = data;
  console.log('Ürün sayısı:', urunler.length);
})
.catch(e=>{
  alert('fiyat.json yüklenemedi: '+e.message+'\nDosya index.html ile aynı klasörde olmalı.');
});

const searchInput = document.getElementById('urunSearch');
const listBox = document.getElementById('urunList');

searchInput.addEventListener('input', function(){
  const q = this.value.toLocaleLowerCase('tr').trim();
  listBox.innerHTML='';
  if(q.length<1){ listBox.style.display='none'; return; }
  const filtered = urunler.filter(u=>u.urun.toLocaleLowerCase('tr').includes(q));
  if(filtered.length===0){ listBox.style.display='none'; return; }
  filtered.slice(0,50).forEach(u=>{
    const div=document.createElement('div');
    div.textContent=u.urun;
    div.onclick=()=>{
      searchInput.value=u.urun;
      selectedUrun=u;
      listBox.style.display='none';
      updateCalc();
    };
    listBox.appendChild(div);
  });
  listBox.style.display='block';
});
document.addEventListener('click', e=>{
  if(!searchInput.contains(e.target) && !listBox.contains(e.target))
    listBox.style.display='none';
});

function fmt(n, para){ return n.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})+' '+para; }
function updateCalc(){
  const miktar = parseFloat(document.getElementById('miktar').value)||0;
  document.getElementById('miktarBirim').value = miktar * 6;
  document.getElementById('evrakBirim').value = 'Metre';
  if(!selectedUrun) return;
  const para = document.getElementById('paraBirimi').value;
  const iskonto = parseFloat(document.getElementById('iskonto').value)||0;
  const kdv = parseFloat(document.getElementById('kdvOran').value)||0;
  const birimFiyat = para==='TL' ? selectedUrun.fiyatTL : selectedUrun.fiyatUSD;
  const oFiyat = birimFiyat * miktar;
  const iskontolu = oFiyat * (1 - iskonto/100);
  const kdvTutar = iskontolu * (kdv/100);
  const genel = iskontolu + kdvTutar;
  document.getElementById('oFiyat').value = fmt(oFiyat, para);
  document.getElementById('iskontoluFiyat').value = fmt(iskontolu, para);
  document.getElementById('kdvTutar').value = fmt(kdvTutar, para);
  document.getElementById('genelToplam').value = fmt(genel, para);
}
['miktar','iskonto','kdvOran','paraBirimi'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updateCalc);
});

function addToCart(){
  if(!selectedUrun){ alert('Önce ürün seçin'); return; }
  const para = document.getElementById('paraBirimi').value;
  const miktar = parseFloat(document.getElementById('miktar').value)||0;
  const miktarBirim = parseFloat(document.getElementById('miktarBirim').value)||0;
  const iskonto = parseFloat(document.getElementById('iskonto').value)||0;
  const kdv = parseFloat(document.getElementById('kdvOran').value)||0;
  const birimFiyat = para==='TL' ? selectedUrun.fiyatTL : selectedUrun.fiyatUSD;
  const oFiyat = birimFiyat * miktar;
  const iskontolu = oFiyat * (1 - iskonto/100);
  const kdvTutar = iskontolu * (kdv/100);
  const genel = iskontolu + kdvTutar;
  sepet.push({urun:selectedUrun.urun, miktar, miktarBirim, para, iskontolu, kdvTutar, genel, kdv, iskonto});
  renderSepet();
  searchInput.value='';
  selectedUrun=null;
  ['oFiyat','iskontoluFiyat','kdvTutar','genelToplam'].forEach(id=>document.getElementById(id).value='');
}
function renderSepet(){
  const tbody=document.querySelector('#cartTable tbody');
  tbody.innerHTML='';
  let ara=0, kdvToplam=0, genelToplam=0;
  sepet.forEach((item,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${item.urun}</td><td>${item.miktar} Adet</td><td>${item.miktarBirim} Metre</td><td>%${item.iskonto}</td><td>%${item.kdv}</td><td>${fmt(item.genel,item.para)}</td><td><button onclick="sil(${i})" style="background:#d32f2f; padding:4px 8px;">Sil</button></td>`;
    tbody.appendChild(tr);
    ara+=item.iskontolu; kdvToplam+=item.kdvTutar; genelToplam+=item.genel;
  });
  document.getElementById('araToplam').textContent=fmt(ara,'TL');
  document.getElementById('toplamKdv').textContent=fmt(kdvToplam,'TL');
  document.getElementById('genelToplamSepet').textContent=fmt(genelToplam,'TL');
}
function sil(i){ sepet.splice(i,1); renderSepet(); }
</script>
</body>
</html>
